name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests · PHP ${{ matrix.php }} · Composer ${{ matrix.composer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        composer: ['2.6.*', '2.*']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  e2e:
    name: E2E · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Set up demo project at /tmp/demo
        env:
          PLUGIN_PATH: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/demo
          cd /tmp/demo
          cp "${PLUGIN_PATH}/art/example-banner.txt" banner.txt
          cat > composer.json <<JSON
          {
              "name": "test/fanfare-e2e",
              "version": "0.0.1",
              "type": "project",
              "repositories": [
                  {"type": "path", "url": "${PLUGIN_PATH}", "options": {"symlink": true}}
              ],
              "require": {"wazum/composer-fanfare": "*"},
              "config": {"allow-plugins": {"wazum/composer-fanfare": true}},
              "extra": {
                  "fanfare": {
                      "template": "banner.txt",
                      "colors": "sunset"
                  }
              },
              "minimum-stability": "dev"
          }
          JSON

      - name: Truecolor output is rendered with --ansi
        working-directory: /tmp/demo
        env:
          COLORTERM: truecolor
        run: |
          output=$(composer update --ansi --no-interaction 2>&1)
          echo "$output"
          echo "$output" | grep -qF '░' || { echo "::error::banner content missing"; exit 1; }
          echo "$output" | grep -qF $'\x1b[38;2;' || { echo "::error::truecolor escapes missing"; exit 1; }
          echo "$output" | grep -qF 'PHP ' || { echo "::error::footer missing"; exit 1; }

      - name: 256-color fallback (TERM=xterm-256color)
        working-directory: /tmp/demo
        env:
          TERM: xterm-256color
          COLORTERM: ''
        run: |
          rm -rf vendor composer.lock
          output=$(composer update --ansi --no-interaction 2>&1)
          echo "$output"
          echo "$output" | grep -qF '░' || { echo "::error::banner content missing"; exit 1; }
          echo "$output" | grep -qF $'\x1b[38;5;' || { echo "::error::256-color escapes missing"; exit 1; }
          if echo "$output" | grep -qF $'\x1b[38;2;'; then
            echo "::error::truecolor escape present despite TERM=xterm-256color"; exit 1
          fi

      - name: 16-color fallback (TERM=ansi)
        working-directory: /tmp/demo
        env:
          TERM: ansi
          COLORTERM: ''
        run: |
          rm -rf vendor composer.lock
          output=$(composer update --ansi --no-interaction 2>&1)
          echo "$output"
          echo "$output" | grep -qF '░' || { echo "::error::banner content missing"; exit 1; }
          if echo "$output" | grep -qE $'\x1b\\[(38;2;|38;5;)'; then
            echo "::error::higher-than-16-color escape present despite TERM=ansi"; exit 1
          fi
          echo "$output" | grep -qE $'\x1b\\[(3[0-7]|9[0-7])m' || { echo "::error::basic ANSI color escape missing"; exit 1; }

      - name: Plain text fallback in non-TTY CI
        working-directory: /tmp/demo
        run: |
          rm -rf vendor composer.lock
          output=$(composer update --no-interaction 2>&1)
          echo "$output"
          echo "$output" | grep -qF '░' || { echo "::error::banner content missing"; exit 1; }
          if echo "$output" | grep -qF $'\x1b['; then
            echo "::error::ANSI escapes present in non-TTY CI output"; exit 1
          fi

      - name: NO_COLOR forces plain even with --ansi
        working-directory: /tmp/demo
        env:
          NO_COLOR: '1'
        run: |
          rm -rf vendor composer.lock
          output=$(composer update --ansi --no-interaction 2>&1)
          echo "$output"
          echo "$output" | grep -qF '░' || { echo "::error::banner content missing"; exit 1; }
          if echo "$output" | grep -qF $'\x1b[38;2;'; then
            echo "::error::truecolor escape present despite NO_COLOR"; exit 1
          fi

      - name: --quiet suppresses banner entirely
        working-directory: /tmp/demo
        run: |
          rm -rf vendor composer.lock
          output=$(composer update --ansi --no-interaction --quiet 2>&1)
          if echo "$output" | grep -qF '░'; then
            echo "::error::banner appeared despite --quiet"; exit 1
          fi

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: composer.json is normalized
        run: composer normalize --dry-run

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Code style (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Security audit
        run: composer audit

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Infection
        run: vendor/bin/infection --threads=4 --no-progress
